defaults:
  - _self_
  - frame_stack: base
  - grid_cell: base

name: mlp
obs_embed_hidden_sizes: [64, 64]
# Ray channels zeroed before the embedding, e.g. [3] hides the distances (use it with the depth aux head,
# which otherwise regresses an input channel). Aux labels still come from the unmasked rays
masked_channels: []
