hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - env.room_path=rooms/one_room.json
    - observation=mlp_observation,cnn_observation
    - backbone=mlp_backbone,lstm_backbone
    - env.range_type=diagonal,horizontal,inf
  job:
    name: train
    chdir: null
    override_dirname: backbone=mlp_backbone,lstm_backbone,env.range_type=diagonal,horizontal,inf,env.room_path=rooms/one_room.json,observation=mlp_observation,cnn_observation
    id: ???
    num: ???
    config_name: base
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.3
    version_base: '1.3'
    cwd: /Users/emers/projects/semproj-rl-comparison
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/emers/projects/semproj-rl-comparison/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      head: base_head
      backbone: mlp_backbone
      observation: mlp_observation
      env: base_env
      algorithm: ppo
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
algorithm:
  name: ppo
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coeff: 0.0
  val_coeff: 0.5
  aux_coeff: 0.2
  task_coeff: 1.0
  intr_coeff: 0.0
  target_kl: null
  max_grad_norm: 0.5
  lr: 0.0003
  n_iterations: 100
  max_steps: 512
  num_steps: 256
  n_epochs: 2
  save_interval: 10
  mini_batch_size: 128
env:
  name: NavEnv
  room_path: rooms/one_room.json
  num_classes: 3
  act_dim: 2
  action_low: -1
  action_high: 1
  max_speed: 13.0
  range_type: diagonal
  ray_density: 0.2
  fov: 180
  ray_encoding: 7
  proprio_dim: 2
  init_pos:
    x: 50.0
    'y': 50.0
  goal_pos:
    x: 10.0
    'y': 10.0
  num_envs: 256
  gamma: 0.99
  goal_radius: 4.0
observation:
  name: mlp
  obs_embed_hidden_sizes:
  - 64
  - 64
backbone:
  name: mlp
  backbone_hidden_sizes:
  - 64
  - 64
head:
  name: base-head
  policy_hidden_sizes:
  - 64
  - 64
  value_hidden_sizes:
  - 64
  - 64
wandb:
  project: semproj
  entity: eazevedo-eth-z-rich
  group: test
  tags:
  - ppo
  mode: online
seed: 42
