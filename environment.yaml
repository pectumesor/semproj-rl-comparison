name: semproj
channels:
  - pytorch
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - pytorch>=2.2
  - torchvision
  - numpy<2.0          # torch still has occasional numpy 2.x issues

  # Viz & analysis
  - matplotlib
  - seaborn

  # Dev
  - pytest

  # Everything below must live in a single pip block — conda only honours one.
  - pip:
    - gymnasium>=0.29
    - stable-baselines3 # optional — useful to cross-check your PPO/SAC impl
    - sb3-contrib
    - pygame
    - tensorboard
    - imageio
    - imageio-ffmpeg
    - triangle
    - networkx[default]

    # Config management
    - hydra-core>=1.3
    - hydra-submitit-launcher
    - omegaconf

    # Logging & tracking
    - wandb[media]

    # Viz & analysis
    - tqdm
    - opencv-python-headless

    # Dev
    - black
    - ruff
