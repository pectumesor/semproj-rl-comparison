name: sac
tau: 0.005
target_entropy: -2
init_alpha: 0.2
actor_lr: 3e-4
critic_lr: 3e-4
alpha_lr: 3e-4

num_steps: 10000
max_steps: 512
n_iterations: 20000
# SAC's train loop takes exactly one env.step() per iteration (num_steps above
# is the replay buffer capacity, unrelated to steps-per-iteration). Used by the
# test harness to size SB3's total_timesteps to match this algorithm's actual
# step count: n_iterations * env_steps_per_iteration * num_envs.
env_steps_per_iteration: 1
mini_batch_size: 256
# Update-to-data (UTD) ratio = (n_gradient_update * mini_batch_size) / (train_freq * env.num_envs).
n_gradient_update: 4
warm_start_steps: 1000
train_freq: 4
eval_freq: 100
save_interval: 10

# n_iterations acts as an upper bound; training stops early once
# the EMA of the eval return plateaus for `patience` consecutive evaluations
# (evaluations happen every `eval_freq` steps, not every iteration) AND that
# EMA has reached `min_converged_value` (so we never stop on an early
# low-return plateau while the policy is still bad).
#
# Reward scale (navigation env): -1/max_steps per step, +1.0 on reaching the
# goal. So eval_return is -1.0 if the goal is never reached and approaches
# +1.0 the faster the goal is reached. min_converged_value: 0.9 requires the
# policy to reach the goal within ~50 steps on average before we allow an
# early stop; lower it (e.g. 0.3-0.5) if that is too strict for a room.
early_stopping:
  enabled: true
  patience: 20
  min_delta: 0.01
  ema_alpha: 0.1
  min_converged_value: 0.9
  # Also require the training return EMA to have plateaued before stopping, so
  # a noisy eval-return plateau alone can't end a run that is still learning.
  # train_min_delta is on the per-step reward scale.
  track_train_return: true
  train_min_delta: 0.002
