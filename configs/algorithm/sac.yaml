name: sac
tau: 0.005
target_entropy: -2
init_alpha: 0.2
actor_lr: 3e-4
critic_lr: 3e-4
alpha_lr: 3e-4

num_steps: 10000
max_steps: 512
n_iterations: 10000
mini_batch_size: 256 
n_gradient_update: 64
warm_start_steps: 1000
train_freq: 4
eval_freq: 100
save_interval: 10

# n_iterations acts as an upper bound; training stops early once
# the EMA of the eval return plateaus for `patience` consecutive evaluations
# (evaluations happen every `eval_freq` steps, not every iteration).
early_stopping:
  enabled: true
  patience: 20
  min_delta: 0.01
  ema_alpha: 0.1
  