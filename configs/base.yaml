defaults:
  - algorithm: ppo
  - env: base_env
  - observation: mlp_observation
  - backbone: mlp_backbone
  - head: base_head
  - _self_

wandb:
  project: semproj
  entity: eazevedo-eth-z-rich
  group: ablation    
  mode: online       # online | offline | disabled

seed: 0

# Each module (embedding, MLP backbone) ends in a plain linear layer, so its output feeds the next module's
# first linear layer without a nonlinearity and the two act as one linear map. True adds a ReLU after them
module_output_activation: false

# Checkpoints and per-seed metric arrays go to
# <storage>/{models,eval_metrics}/<timestamp>/<room>/<architecture>/seed_<s>
storage: ${hydra:runtime.cwd}/logs
# The .sh scripts pass one timestamp for the whole sweep: SLURM jobs resolve ${now:} on their
# own node at their own start time, so this default only stays shared within a single process
timestamp: ${now:%Y%m%d_%H%M%S}
