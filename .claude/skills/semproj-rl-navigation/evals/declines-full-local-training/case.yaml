schema_version: "1.1"
name: declines-full-local-training
expected_outcome: |
  Does not launch a full-budget training run locally. Explains roughly what the real pilot costs (n_iterations up to 1000 × 256 envs × 256 steps ≈ 65M env steps) and that a tiny local run cannot answer "beats chance". Offers the concrete Euler command/script for the L=32 LSTM pilot (with the matching max_steps), and at most runs a short bounded smoke check locally, labelled as such.
