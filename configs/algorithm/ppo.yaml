name: ppo
gae_lambda: 0.95
clip_epsilon: 0.2
# Small entropy bonus: keeps a floor on exploration so the action std can't
# collapse to a near-deterministic policy that then gets stuck in a bad region
# (observed as catastrophic mid-training collapse on some seeds).
# The earlier "0.005 pins log_std at the ceiling" symptom was a bug in
# compute_entropy_loss (summed over the batch instead of averaging, so the term
# was ~mini_batch_size x too large). With that fixed, 0.005 is a normal value.
# Watch "Global Std": it should settle around 0.1-0.6, not sit at exp(1)=2.72.
entropy_coeff: 0.005
val_coeff: 0.5
aux_coeff: 0.2
task_coeff: 1.0
intr_coeff: 0.0
# Hard trust-region guard: once the running-mean KL(old||new) over an update exceeds `1.5 * target_kl`,
# the rest of the epoch loop for that rollout is skipped, so a drifting policy
# can't be wrecked by the tail of the update.
# Do NOT tighten this off the current logs: the 5-seed rerun's low mean KL (~0.01)
# and max KL (~0.02-0.04) are deflated by the log_std saturation (see entropy_coeff).
# Fix the std, rerun, then expect target_kl to settle around 0.02-0.03.
target_kl: 0.04
max_grad_norm: 0.5

lr: 3e-4
# Linearly decay the LR from `lr` to 0 over `n_iterations`. Standard PPO practice:
# stops full-size updates late in training once the policy has largely converged.
# When true, the KL-reactive LR adjustment is disabled (the two would fight).
anneal_lr: true
n_iterations: 1000
max_steps: 512
num_steps: 256
n_epochs: 2
save_interval: 100
mini_batch_size: 256

# evaluate_policy() is expensive (it rolls out num_eval_envs episodes until the
# slowest one terminates, i.e. up to max_steps env-steps). Only run it every
# `eval_interval` iterations; the early stopper and best-checkpoint logic run on
# the same cadence. Set to 1 to evaluate every iteration.
eval_interval: 5

# n_iterations acts as an upper bound; training stops early once
# the EMA of the eval return plateaus for `patience` consecutive evaluations
# AND that EMA has reached `min_converged_value` (so we never stop on an
# early low-return plateau while the policy is still bad).
#
# Three guards against stopping on normal RL variance:
#   1. Rollout averaging: each check averages the eval return over
#      env.num_eval_envs (=50) parallel episodes, not a single episode.
#   2. Patience window: stop only after `patience` consecutive checks with no
#      improvement.
#   3. Smoothing: the plateau test runs on an EMA of the per-check scores
#      (ema_alpha=0.2 => effective window of ~last 9 checks), not the raw score.
#
# patience/ema_alpha are counted in evaluations, not iterations: with
# eval_interval=5, patience=10 means ~50 iterations of no improvement.
#
# Reward scale (navigation env): -1/max_steps per step, +1.0 on reaching the
# goal. So eval_return is -1.0 if the goal is never reached and approaches
# +1.0 the faster the goal is reached. min_converged_value: 0.9 requires the
# policy to reach the goal within ~50 steps on average before we allow an
# early stop; lower it (e.g. 0.3-0.5) if that is too strict for a room.
early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.01
  ema_alpha: 0.2
  min_converged_value: 0.8
  # Eval return is the only stopping signal. The rollout averaging + patience +
  # EMA smoothing above are what protect against a premature stop, so the
  # (stochastic) training-return plateau check is disabled.
  track_train_return: false
  train_min_delta: 0.002

# Recurrent PPO
num_layers: 2

# minibatch_size needs to be able to divide num_envs
minibatch_size: 64
